name: Docker Build & Push AppServer to Docker Hub

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push AppServer Image on Local Infrastructure
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # Resgata ambos os arquivos binários de forma relativa no host local do Runner
      - name: Resgatar Instaladores Proprietários no Workspace
        run: |
          cp ../../appserver.tar.gz . 2>/dev/null || cp "${{ github.workspace }}/../appserver.tar.gz" . 2>/dev/null || cp /media/rodrigo/dados/docker-protheus-appserver/appserver.tar.gz .
          cp ../../webapp.tar.gz . 2>/dev/null || cp "${{ github.workspace }}/../webapp.tar.gz" . 2>/dev/null || cp /media/rodrigo/dados/docker-protheus-appserver/webapp.tar.gz .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: rodrigomicrosiga/appserver-dev:24.3.1.5  # Tag imutável baseada na label original