name: Docker Build & Push AppServer to Docker Hub

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push AppServer Image on Local Infrastructure
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 🚀 SOLUÇÃO DEFINITIVA: Resgata os pacotes dinamicamente usando curingas de extensão
      - name: Resgatar Instaladores Proprietários no Workspace
        run: |
          cp ../../*appserver*.[tT][aA][rR].[gG][zZ] . 2>/dev/null || cp "${{ github.workspace }}/../"*appserver*.[tT][aA][rR].[gG][zZ] . 2>/dev/null || cp /media/rodrigo/dados/docker-protheus-appserver/*appserver*.[tT][aA][rR].[gG][zZ] .
          cp ../../*webapp*.[tT][aA][rR].[gG][zZ] . 2>/dev/null || cp "${{ github.workspace }}/../"*webapp*.[tT][aA][rR].[gG][zZ] . 2>/dev/null || cp /media/rodrigo/dados/docker-protheus-appserver/*webapp*.[tT][aA][rR].[gG][zZ] .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: rodrigomicrosiga/appserver-dev:24.3.1.5